services:
  webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: boardroom-web:latest
    container_name: boardroom-web
    restart: unless-stopped
    ports:
      - "28473:28473"
    environment:
      BOARDROOM_HOST: 0.0.0.0
      BOARDROOM_PORT: "28473"
      BOARDROOM_TB_UPSTREAM: http://tensorboard:6006
      BOARDROOM_DISABLE_TB: "1"
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Connect to host NVIDIA MPS when enabled (make mps-start)
      CUDA_MPS_PIPE_DIRECTORY: /tmp/nvidia-mps
      CUDA_MPS_LOG_DIRECTORY: /tmp/nvidia-mps-log
    env_file:
      - ../.env
    volumes:
      - ../.env:/app/.env
      - ../config:/app/config
      - ../trading_system/outputs:/app/trading_system/outputs
      - ../trading_system/models:/app/trading_system/models
      - ../trading_system/data/cache:/app/trading_system/data/cache
      - /tmp/nvidia-mps:/tmp/nvidia-mps
      - /tmp/nvidia-mps-log:/tmp/nvidia-mps-log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tensorboard
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tensorboard:
    image: tensorflow/tensorflow:2.15.0
    container_name: boardroom-tensorboard
    restart: unless-stopped
    command:
      - tensorboard
      - --logdir
      - /logs
      - --host
      - 0.0.0.0
      - --port
      - "6006"
      - --reload_interval
      - "5"
      - --path_prefix
      - /tb
    ports:
      - "6006:6006"
    volumes:
      - ../trading_system/models/meta_learner/tensorboard:/logs:ro

  ollama:
    image: ollama/ollama:latest
    container_name: boardroom-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    environment:
      CUDA_MPS_PIPE_DIRECTORY: /tmp/nvidia-mps
      CUDA_MPS_LOG_DIRECTORY: /tmp/nvidia-mps-log
    volumes:
      - ollama-data:/root/.ollama
      - /tmp/nvidia-mps:/tmp/nvidia-mps
      - /tmp/nvidia-mps-log:/tmp/nvidia-mps-log
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
